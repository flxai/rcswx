[workspace]
members = ["crates/rcswx-core", "crates/rcswx-python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
sha2 = "0.10.9"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
