[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rcswx"
version = "0.1.0"
description = "Reference-faithful genotype alignment and crossover with a Rust core"
requires-python = ">=3.12,<3.15"
license-files = ["LICENSE.einsearch"]
dependencies = [
  "torch>=2.3.1,<3",
  "numpy>=1.26.4,<3",
  "scipy>=1.13.0,<2",
  "psutil>=5.9.8,<8",
  "rich>=13.7.1,<15",
  "tqdm>=4.66.4,<5",
  "termcolor>=2.4.0,<4",
]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8,<10"]
benchmark = ["memray>=1.17,<2"]

[tool.maturin]
manifest-path = "crates/rcswx-python/Cargo.toml"
python-source = "python"
module-name = "rcswx._core"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/table42"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve reference equality dispatch and callable names; replacing these is
# a semantic edit for custom metadata and callback serialization.
"python/rcswx/grammars/einspace.py" = ["E711", "E731"]
"python/rcswx/pcfg.py" = ["E711"]
"python/rcswx/recursive.py" = ["E711"]
