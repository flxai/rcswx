[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rcswx"
version = "0.1.0"
description = "Exact bounded grammar-based alignment and crossover for supported PyTorch modules"
requires-python = ">=3.14,<3.15"
dependencies = ["torch>=2.10,<3"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8,<10", "hypothesis>=6,<7"]

[tool.maturin]
manifest-path = "crates/rcswx-python/Cargo.toml"
python-source = "python"
module-name = "rcswx._core"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
