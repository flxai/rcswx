  <g id="text_41">
   <text style="font: 10px 'DejaVu Serif'; text-anchor: start" x="28.8" y="321.984" transform="rotate(-0 28.8 321.984)">Original values are transcribed from the supplied table, not remeasured. Historical hardware and timing boundary are unknown.</text>
