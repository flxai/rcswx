  <g id="text_40">
   <text style="font: 10px 'DejaVu Serif'; text-anchor: start" x="28.8" y="303.264" transform="rotate(-0 28.8 303.264)">Timing ends at Alignment return; input construction and later history traversal are excluded. All native outcomes match exactly.</text>
