  <g id="text_42">
   <text style="font: 10px 'DejaVu Serif'; text-anchor: start" x="28.8" y="340.704" transform="rotate(-0 28.8 340.704)">741.57 minutes is preserved literally; a possible unit typo remains unverified. Native distances round to the published distances.</text>
